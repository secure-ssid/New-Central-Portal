<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 &mdash; Bad request</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f97316' d='M12 1.5l9.1 5.25v10.5L12 22.5l-9.1-5.25V6.75z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ asset_url('/static/app.css') }}">
</head>
<body class="page-centered">
    <main class="card error-page-card">
        <p class="error-code" aria-hidden="true">4<span class="accent">0</span>0</p>
        <hr class="error-rule">
        <h1>Bad request</h1>
        <p class="error-msg">{{ detail if detail else "One of the values in the link or form was not valid. Check the address and try again." }}</p>
        <a class="btn-primary" href="/">&larr;&nbsp; Back to dashboard</a>
    </main>
</body>
</html>
